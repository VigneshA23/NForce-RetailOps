spring:
  application:
    name: retailops

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/retailops}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # On Lambda set DB_POOL_MIN_IDLE=1 — Lambda containers handle one request
      # at a time; a pool minimum of 1 releases idle connections quickly between
      # invocations rather than holding open connections that age out on RDS.
      # Railway default (unset) keeps Hikari's default minimum-idle behaviour.
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Neon drops idle server-side connections faster than Hikari's untuned
      # defaults expect; without a keepalive, a dead pooled connection is only
      # discovered when a request tries to use it (an uncaught SQLException).
      connection-timeout: 20000
      keepalive-time: 240000
      max-lifetime: 1700000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

app:
  # Controls whether Spring's @Scheduled infrastructure is activated.
  # Default: true — Railway and local dev work exactly as today.
  # Set APP_SCHEDULING_ENABLED=false in Lambda's environment variables to disable
  # in-process scheduling; EventBridge Scheduler calls /internal/jobs/** instead.
  # Safety: if this code is merged without APP_SCHEDULING_ENABLED being set in
  # Railway, scheduling continues uninterrupted — this flag only activates
  # Lambda-specific behaviour when explicitly configured.
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:5173}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-env}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

session:
  inactivity-timeout-minutes: ${SESSION_INACTIVITY_TIMEOUT_MINUTES:30}
  remember-me-timeout-minutes: ${SESSION_REMEMBER_ME_TIMEOUT_MINUTES:240}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:RetailOps <onboarding@resend.dev>}

login:
  rate-limit:
    # Set LOGIN_RATE_LIMIT_ENABLED=false in dev/CI to bypass the 5-attempt limit.
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    diskspace:
      # Lambda's deployment directory (/var/task) is a read-only overlay filesystem
      # with 0 reported available bytes, causing this indicator to report DOWN despite
      # the app being fully healthy. Disabled globally — disk space is not a meaningful
      # health signal for this app (static JAR, no file writes) on either Lambda or Railway.
      enabled: false