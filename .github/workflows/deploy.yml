name: Deploy

on:
  push:
    branches: [main, dev]

# Required GitHub repository secrets:
#   VERCEL_TOKEN      → Vercel dashboard → Account Settings → Tokens
#   VERCEL_ORG_ID     → Vercel dashboard → Team Settings → General → Team ID
#   VERCEL_PROJECT_ID → Vercel dashboard → Project Settings → General → Project ID
#
# The Vercel project must have Root Directory = "frontend" set in its dashboard.
# Do NOT pass --cwd frontend to vercel commands — it would double the path.

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info (production)
        if: github.ref_name == 'main'
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment info (preview)
        if: github.ref_name == 'dev'
        run: |
          vercel pull --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: github.ref_name == 'main'
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview and alias to stable QA URL
        if: github.ref_name == 'dev'
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $DEPLOYMENT_URL"
          vercel alias set "$DEPLOYMENT_URL" nforce-retailops-git-dev.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }}
